name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.24'

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test -tags sqlite_fts5 -v ./...

    build:
        needs: test
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      goos: linux
                      goarch: amd64
                      artifact_name: pdf-fts-Linux-x86_64
                      cc: musl-gcc
                      setup_script: |
                          sudo apt-get update
                          sudo apt-get install -y --no-install-recommends musl-dev musl-tools pkg-config build-essential
                    - os: ubuntu-latest
                      goos: linux
                      goarch: arm64
                      artifact_name: pdf-fts-Linux-aarch64
                      cc: aarch64-linux-musl-gcc
                      setup_script: |
                          sudo apt-get update
                          sudo apt-get install -y --no-install-recommends musl-dev musl-tools gcc-aarch64-linux-gnu
                          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
                          tar -xzf aarch64-linux-musl-cross.tgz
                          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
                    - os: macos-13
                      goos: darwin
                      goarch: amd64
                      artifact_name: pdf-fts-Darwin-x86_64
                      cc: clang
                      setup_script: echo "Using native macOS build environment"
                    - os: macos-14
                      goos: darwin
                      goarch: arm64
                      artifact_name: pdf-fts-Darwin-arm64
                      cc: gcc
                      setup_script: echo "Using native macOS ARM build environment with GCC"

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.24'

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Setup build environment
              shell: bash
              run: ${{ matrix.setup_script }}

            - name: Download dependencies
              run: go mod download

            - name: Build static binary
              shell: bash
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CC: ${{ matrix.cc }}
                  CGO_ENABLED: 1
              run: |
                  if [[ "${{ matrix.goos }}" == "linux" ]]; then
                      # Linux: Build static binary with musl
                      echo "Building for Linux with musl..."
                      echo "CC: $CC"
                      echo "GOOS: $GOOS"
                      echo "GOARCH: $GOARCH"
                      
                      # Verify musl-gcc is available
                      which musl-gcc || echo "musl-gcc not found"
                      musl-gcc --version || echo "musl-gcc version check failed"
                      
                      go build -tags sqlite_fts5 -ldflags '-linkmode=external -extldflags=-static' -a -v -o ${{ matrix.artifact_name }} ./cmd/pdf-fts
                  elif [[ "${{ matrix.goos }}" == "darwin" ]]; then
                      # macOS: Build with system libraries
                      go build -tags sqlite_fts5 -o ${{ matrix.artifact_name }} ./cmd/pdf-fts
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_name }}

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      pdf-fts-Linux-x86_64/pdf-fts-Linux-x86_64
                      pdf-fts-Linux-aarch64/pdf-fts-Linux-aarch64
                      pdf-fts-Darwin-x86_64/pdf-fts-Darwin-x86_64
                      pdf-fts-Darwin-arm64/pdf-fts-Darwin-arm64
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
